[package]
name = "btrls"
authors = ["Sivaprakash P"]
version = "1.2.0"
edition = "2024"
repository = "https://github.com/sivaprakashkrp/btrls"
license = "GPL-2.0-or-later"
description = "A tabled ls command written in Rust with the option to get the details of a directory or file as JSON"
readme = "README.md"
homepage = "https://github.com/sivaprakashkrp/btrls"
keywords = ["ls", "tabled", "file-details", "json"]
categories = ["command-line-utilities"]

[dependencies]
clap = {version = "4.5.39", features = ["derive"]}
owo-colors = "4.2.1"
strum = {version = "0.27", features = ["derive"]}
strum_macros = "0.27"
tabled = "0.20.0"
chrono = "0.4.41"
serde = {version = "1.0", features=["derive"]}
serde_json = "1.0"
hf = "0.5.1"
is_executable = "1.0.5"
config = "0.15.19"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
